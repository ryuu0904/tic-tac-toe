<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Mode Selection Screen -->
        <div id="modeSelection" class="screen">
            <div class="card">
                <h1>Tic Tac Toe</h1>
                <p class="subtitle">Choose your game mode</p>
                
                <div class="button-container">
                    <button id="singlePlayerBtn" class="mode-btn single-player">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <span>Single Player</span>
                    </button>
                    
                    <button id="twoPlayerBtn" class="mode-btn two-player">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <span>Two Players (Local)</span>
                    </button>

                    <button id="onlinePlayerBtn" class="mode-btn online-player">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                        </svg>
                        <span>Play Online</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Online Room Screen -->
        <div id="onlineScreen" class="screen hidden">
            <div class="card">
                <button id="backToMenuBtn" class="back-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    </svg>
                    Back
                </button>

                <h1 style="font-size: 2rem; margin-bottom: 30px;">Online Play</h1>
                
                <div class="online-options">
                    <button id="createRoomBtn" class="online-action-btn create-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Create Room
                    </button>
                    
                    <div class="join-room-container">
                        <input type="text" id="roomIdInput" placeholder="Enter Room ID" maxlength="6">
                        <button id="joinRoomBtn" class="online-action-btn join-btn">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                                <polyline points="10 17 15 12 10 7"></polyline>
                                <line x1="15" y1="12" x2="3" y2="12"></line>
                            </svg>
                            Join Room
                        </button>
                    </div>
                </div>

                <div id="roomInfo" class="room-info hidden">
                    <div class="room-id-display">
                        <span class="label">Room ID:</span>
                        <span id="displayRoomId" class="room-id-value"></span>
                        <button id="copyRoomIdBtn" class="copy-btn" title="Copy Room ID">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                    <p id="waitingMessage" class="waiting-message">Waiting for opponent to join...</p>
                    <p id="playerRole" class="player-role"></p>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="screen hidden">
            <div class="card">
                <div class="game-header">
                    <button id="homeBtn" class="icon-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                    </button>
                    <h2 id="modeTitle">vs Computer</h2>
                    <button id="resetBtn" class="icon-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="1 4 1 10 7 10"></polyline>
                            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                        </svg>
                    </button>
                </div>

                <div id="statusContainer" class="status-container">
                    <div id="currentTurn" class="status-box">
                        Current Turn: <span id="turnPlayer" class="turn-player">X</span>
                    </div>
                </div>

                <div id="board" class="board">
                    <button class="cell" data-index="0"></button>
                    <button class="cell" data-index="1"></button>
                    <button class="cell" data-index="2"></button>
                    <button class="cell" data-index="3"></button>
                    <button class="cell" data-index="4"></button>
                    <button class="cell" data-index="5"></button>
                    <button class="cell" data-index="6"></button>
                    <button class="cell" data-index="7"></button>
                    <button class="cell" data-index="8"></button>
                </div>

                <div id="playerInfo" class="player-info">
                    You are <span class="player-x">X</span><br>Computer is <span class="player-o">O</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
 
    <script type="module" src="script.js"></script>
</body>
</html>
